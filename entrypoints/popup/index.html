<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PromptShot</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 290px;
        background: #0e0f12;
        color: #e9ebf0;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .wrap { padding: 16px; display: flex; align-items: center; gap: 12px; }
      .spin {
        width: 18px; height: 18px; flex: 0 0 auto; border-radius: 50%;
        border: 2px solid #2c303a; border-top-color: #6ee7b7;
        animation: spin 0.7s linear infinite; font-size: 14px; text-align: center; line-height: 18px;
      }
      .spin.done { animation: none; border: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg { font-weight: 500; }
      .ok #msg { color: #6ee7b7; }
      .err #msg { color: #f7b955; }
      .path {
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9aa0ad; padding: 0 16px 12px; word-break: break-all; display: none;
      }
      .path.show { display: block; }
      .modes {
        display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid #1c1f26;
        align-items: center;
      }
      .modes .lbl { color: #6b7280; font-size: 11px; margin-right: auto; }
      .modes button {
        background: transparent; color: #9aa0ad; border: 1px solid #2c303a;
        border-radius: 7px; padding: 5px 11px; font-size: 12px; cursor: pointer; font-weight: 500;
      }
      .modes button.active { background: #6ee7b7; color: #06130d; border-color: #6ee7b7; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spin" id="spin"></div>
      <div id="msg">capturing the full page…</div>
    </div>
    <div class="path" id="path"></div>
    <div class="modes">
      <span class="lbl">copy as</span>
      <button data-mode="path" id="mPath">Path</button>
      <button data-mode="image" id="mImage">Image</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
